coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 95%
        threshold: 0%
        informational: false
        if_not_found: failure
comment:
  require_base: true
  require_head: true
ignore:
  - tests/**
  - script/**
codecov:
  require_ci_to_pass: false
  strict_yaml_branch: main
  notify:
    wait_for_ci: false
github_checks: false
